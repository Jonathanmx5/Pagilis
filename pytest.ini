[pytest]
testpaths = tests
# Capture au niveau Python (sys) et non des descripteurs de fichiers (fd, le
# défaut) : sous Windows, la capture fd échange les descripteurs du processus
# entre deux tests et fait échouer environ une fois sur deux la création de la
# fenêtre Tk suivante (« invalid command name tcl_findLibrary »). Mesuré :
# 8 passages verts sur 8 avec --capture=sys.
addopts = --capture=sys
