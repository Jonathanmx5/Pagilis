# Publie une version : il suffit de pousser un tag, par exemple
#     git tag v1.0.2
#     git push origin v1.0.2
# Le numéro de version vient du TAG : il est injecté dans updater.py avant la
# compilation, donc le code, l'exe et version.json ne peuvent plus diverger.
#
# Lancé à la main (onglet Actions > Release > Run workflow), il compile et
# fournit l'exe en téléchargement SANS rien publier : utile pour tester.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write  # créer la release et y joindre les fichiers

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Numéro de version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0-essai"  # compilation d'essai : jamais publiée
          }
          # Remplace APP_VERSION dans updater.py, et vérifie que c'est bien fait.
          (Get-Content updater.py -Raw) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$version`"" |
            Set-Content updater.py -NoNewline -Encoding utf8
          python -c "import updater, sys; v = updater.APP_VERSION; print('APP_VERSION =', v); sys.exit(v != '$version')"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache des fichiers de langue Tesseract
        uses: actions/cache@v4
        with:
          path: tessdata
          key: tessdata-fast-fra-eng-v1

      # Même script que sur le poste du développeur : dépendances, analyse, tests, exe.
      - name: Compilation
        shell: cmd
        run: build_exe.bat

      - name: Empreinte et fichier de version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $sha = (Get-FileHash dist/PDFStudio.exe -Algorithm SHA256).Hash.ToLower()
          [ordered]@{
            version = $version
            url     = "https://github.com/${{ github.repository }}/releases/download/v$version/PDFStudio.exe"
            sha256  = $sha
          } | ConvertTo-Json | Set-Content dist/version.json -Encoding utf8
          Get-Content dist/version.json

      - name: Exe en téléchargement (compilation d'essai)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PDFStudio-essai
          path: dist/PDFStudio.exe

      - name: Publication de la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/PDFStudio.exe dist/version.json
          --title "PDF Studio ${{ steps.version.outputs.version }}"
          --notes "PDF Studio version ${{ steps.version.outputs.version }}."
          --verify-tag
