# Publie une version : il suffit de pousser un tag, par exemple
#     git tag v1.2.0            (version pour tous)
#     git tag v1.2.0-beta.1     (bêta : seulement pour qui a activé « Versions bêta »)
#     git push origin <tag>
# Le numéro de version vient du TAG : il est injecté dans updater.py avant la
# compilation, donc le code, l'exe et version.json ne peuvent plus diverger.
# CHANGELOG.md doit avoir une section pour cette version, sinon rien n'est publié.
#
# Lancé à la main (onglet Actions > Release > Run workflow), il fait tout SAUF
# publier, et fournit l'exe en téléchargement : utile pour tester.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write  # créer la release et y joindre les fichiers

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"  # accents des notes de version sans erreur d'encodage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Numéro de version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            # Compilation d'essai, jamais publiée : version du code suffixée.
            $version = (python -c "import updater; print(updater.APP_VERSION)") + "-essai"
          }
          # Remplace APP_VERSION dans updater.py, et vérifie que c'est bien fait.
          (Get-Content updater.py -Raw) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$version`"" |
            Set-Content updater.py -NoNewline -Encoding utf8
          python -c "import updater, sys; v = updater.APP_VERSION; print('APP_VERSION =', v); sys.exit(v != '$version')"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Vérifié AVANT la compilation : inutile de compiler 3 minutes pour rien.
      - name: Notes de version (CHANGELOG.md)
        run: python -c "import publication, pathlib; print(publication.notes_de_version(pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8'), '${{ steps.version.outputs.version }}'))"

      - name: Cache des fichiers de langue Tesseract
        uses: actions/cache@v6
        with:
          path: tessdata
          key: tessdata-fast-fra-eng-v1

      # Même script que sur le poste du développeur : dépendances, analyse, tests,
      # exe, puis auto-vérification de l'exe compilé (--verifier).
      - name: Compilation
        shell: cmd
        run: build_exe.bat

      - name: Empreinte, notes et fichier de version
        run: python publication.py "${{ steps.version.outputs.version }}" "${{ github.repository }}" dist/Pagilis.exe dist

      - name: Exe en téléchargement (compilation d'essai)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Pagilis-essai
          path: dist/Pagilis.exe

      - name: Publication de la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # Une bêta est une « pre-release » : GitHub ne la présente jamais comme la
          # dernière version, donc le canal normal ne la voit pas.
          $options = @()
          if ($version.Contains("-")) { $options += "--prerelease" }
          gh release create "${{ github.ref_name }}" dist/Pagilis.exe dist/version.json `
            --title "Pagilis $version" --notes-file dist/notes.md --verify-tag @options
